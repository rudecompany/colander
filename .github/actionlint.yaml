# actionlint settings (CI job "workflows").
# Every configuration variable the workflows read; docs/deploy.md says where each one is set.
config-variables:
  - CLOUDFLARE_ACCOUNT_ID
  - COLANDER_PUBLIC_KEYS
  - STAGING_PUBLIC_KEYS
  - CWS_ITEM_ID
  - CWS_PUBLISHER_ID
  - GCP_WORKLOAD_IDENTITY_PROVIDER
  - GCP_SERVICE_ACCOUNT
  - RELEASE_APP_CLIENT_ID
  - EDGE_PRODUCT_ID
  - EDGE_ITEM_ID
  - AMO_SLUG
  - TURNSTILE_SITE_KEY
paths:
  .github/workflows/*.yml:
    ignore:
      # actionlint 1.7.12, which CI runs, knows environment.deployment; older local builds do not.
      - 'unexpected key "deployment" for "environment" section'
  .github/workflows/release.yml:
    ignore:
      # actionlint 1.7.12 predates create-github-app-token 3.x, where client-id replaced the
      # deprecated app-id input.
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1"'
