# The authenticated ops channel (hosting plan section 2, flow 13; contract in docs/deploy.md).
# It posts one command to /ops/<command> with a GitHub Actions OIDC token, which the Worker takes
# only from a workflow of this repository on main, in the GitHub environment of the Worker it calls.
# There is no static token. This run log and the Worker's audit log are the audit trail: who ran
# what, with which arguments, and what the Worker answered.
name: Ops

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to run the command
        type: choice
        options: [production, staging]
        default: production
      command:
        description: The ops command
        type: choice
        options: [status, grant-role, pin-subject, import-seed, revoke-seed, calibration-sample, calibration-export, sign-config, drill, purge-cache, restore-dump, pitr-restore]
      args:
        description: 'Arguments as a JSON object, for example {"email": "sam@example.com", "role": "curator"}. Staff and admin only until the first admin is made.'
        default: '{}'
      confirm:
        description: 'Destructive commands only: pitr-restore needs args.at typed again, restore-dump args.key, revoke-seed args.seed, purge-cache the word purge-cache'
        default: ''

permissions:
  contents: read
  # The OIDC token the Worker checks: repository, main, workflow file and environment.
  id-token: write

concurrency:
  group: ops-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ops:
    name: ops
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      COMMAND: ${{ inputs.command }}
      ARGS: ${{ inputs.args }}
      CONFIRM: ${{ inputs.confirm }}
      BASE: ${{ inputs.environment == 'staging' && 'https://staging.getcolander.com' || 'https://getcolander.com' }}
    steps:
      - name: Build the request
        run: |
          if ! jq -e 'type == "object"' <<<"$ARGS" >/dev/null 2>&1; then
            echo "::error::args must be a JSON object, got: $ARGS"
            exit 1
          fi
          # sign-config signs the adapter configuration the Worker reads from this run's commit on
          # main itself; no command takes a file from the arguments.
          if jq -e 'has("file")' <<<"$ARGS" >/dev/null; then
            echo "::error::args may not hold file. sign-config signs extension/src/adapters/default-config.json as committed on main."
            exit 1
          fi
          destructive=1
          case "$COMMAND" in
          pitr-restore) expected=$(jq -r '.at // ""' <<<"$ARGS") ;;
          restore-dump) expected=$(jq -r '.key // ""' <<<"$ARGS") ;;
          revoke-seed) expected=$(jq -r '.seed // ""' <<<"$ARGS") ;;
          purge-cache) expected=purge-cache ;;
          *) destructive=0 ;;
          esac
          if [ "$destructive" = 1 ] && { [ -z "$expected" ] || [ "$CONFIRM" != "$expected" ]; }; then
            echo "::error::$COMMAND is destructive. Set confirm to exactly the value it names (see the input description)."
            exit 1
          fi
          body=$(jq -c --arg confirm "$CONFIRM" '. + (if $confirm == "" then {} else {confirm: $confirm} end)' <<<"$ARGS")
          printf '%s' "$body" >"$RUNNER_TEMP/body.json"
          echo "POST $BASE/ops/$COMMAND by $GITHUB_ACTOR at $GITHUB_SHA with arguments:"
          jq . "$RUNNER_TEMP/body.json"
      - name: Run the command
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # A GitHub Actions OIDC token for this origin; it lives a few minutes.
          token=$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BASE" | jq -r .value)
          echo "::add-mask::$token"
          access=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            access=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          status=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST "$BASE/ops/$COMMAND" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "${access[@]}" \
            --data-binary "@$RUNNER_TEMP/body.json")
          echo "HTTP $status"
          jq . "$RUNNER_TEMP/out.json" 2>/dev/null || cat "$RUNNER_TEMP/out.json"
          {
            echo "### ops $COMMAND on ${BASE#https://}: HTTP $status"
            echo '```json'
            jq . "$RUNNER_TEMP/out.json" 2>/dev/null || cat "$RUNNER_TEMP/out.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          [[ "$status" == 2?? ]]
