# The authenticated ops channel (hosting plan section 2, flow 13; contract in docs/deploy.md).
# It posts one command to /ops/<command> with the environment's OPS_TOKEN. This run log is the
# audit trail: who ran what, with which arguments, and what the Worker answered.
name: Ops

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to run the command
        type: choice
        options: [production, staging]
        default: production
      command:
        description: The ops command
        type: choice
        options: [status, grant-role, import-seed, sign-config, drill, purge-cache, restore-dump, pitr-restore]
      args:
        description: 'Arguments as a JSON object, for example {"email": "sam@example.com", "role": "curator"}'
        default: '{}'
      file:
        description: Optional repository path whose text becomes the "file" argument (sign-config, import-seed)
        default: ''
      confirm:
        description: 'Destructive commands only: pitr-restore needs args.at typed again, restore-dump args.key, purge-cache the word purge-cache'
        default: ''

permissions:
  contents: read

concurrency:
  group: ops-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  ops:
    name: ops
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      COMMAND: ${{ inputs.command }}
      ARGS: ${{ inputs.args }}
      FILE: ${{ inputs.file }}
      CONFIRM: ${{ inputs.confirm }}
      BASE: ${{ inputs.environment == 'staging' && 'https://staging.getcolander.com' || 'https://getcolander.com' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the request
        run: |
          if ! jq -e 'type == "object"' <<<"$ARGS" >/dev/null 2>&1; then
            echo "::error::args must be a JSON object, got: $ARGS"
            exit 1
          fi
          destructive=1
          case "$COMMAND" in
          pitr-restore) expected=$(jq -r '.at // ""' <<<"$ARGS") ;;
          restore-dump) expected=$(jq -r '.key // ""' <<<"$ARGS") ;;
          purge-cache) expected=purge-cache ;;
          *) destructive=0 ;;
          esac
          if [ "$destructive" = 1 ] && { [ -z "$expected" ] || [ "$CONFIRM" != "$expected" ]; }; then
            echo "::error::$COMMAND is destructive. Set confirm to exactly the value it names (see the input description)."
            exit 1
          fi
          body=$(jq -c --arg confirm "$CONFIRM" '. + (if $confirm == "" then {} else {confirm: $confirm} end)' <<<"$ARGS")
          if [ -n "$FILE" ]; then
            if [ ! -f "$FILE" ]; then
              echo "::error::$FILE is not a file in the repository."
              exit 1
            fi
            body=$(jq -c --rawfile file "$FILE" '. + {file: $file}' <<<"$body")
          fi
          printf '%s' "$body" >"$RUNNER_TEMP/body.json"
          echo "POST $BASE/ops/$COMMAND by $GITHUB_ACTOR with arguments:"
          jq 'if has("file") then .file = "(\(.file | length) characters)" else . end' "$RUNNER_TEMP/body.json"
      - name: Run the command
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          access=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            access=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          status=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST "$BASE/ops/$COMMAND" \
            -H "Authorization: Bearer $OPS_TOKEN" -H 'Content-Type: application/json' "${access[@]}" \
            --data-binary "@$RUNNER_TEMP/body.json")
          echo "HTTP $status"
          jq . "$RUNNER_TEMP/out.json" 2>/dev/null || cat "$RUNNER_TEMP/out.json"
          {
            echo "### ops $COMMAND on ${BASE#https://}: HTTP $status"
            echo '```json'
            jq . "$RUNNER_TEMP/out.json" 2>/dev/null || cat "$RUNNER_TEMP/out.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          [[ "$status" == 2?? ]]
