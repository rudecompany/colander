# Hourly outside check of production, next to the in-Cloudflare watchdog cron (the primary alarm).
# GitHub may delay or skip scheduled runs, so this is the second line, not the first. Weekly, it
# also checks that the Edge Add-ons API key still works, since those keys expire after 72 days.
name: Probes

on:
  schedule:
    - cron: '41 * * * *'
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: probes
  cancel-in-progress: false

jobs:
  production:
    name: probe-production
    # Skips until the Cloudflare account is set up (docs/deploy.md step 15).
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event.schedule != '23 7 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Site, /healthz, the snapshot signed by the production key, delta 204 at head, CORS.
      - name: Read-only smoke test
        run: node scripts/smoke.ts
        env:
          COLANDER_BASE_URL: https://getcolander.com
          COLANDER_PUBLIC_KEYS: ${{ vars.COLANDER_PUBLIC_KEYS }}
      - name: Store health from /ops/status
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          status=$(curl -sS --fail-with-body -X POST https://getcolander.com/ops/status \
            -H "Authorization: Bearer $OPS_TOKEN" -H 'Content-Type: application/json' -d '{}')
          echo "$status" | jq .
          # Scoring pass under 15 minutes old, newest dump under 7 hours, no verdict change waiting
          # longer than the 6-hour list update bound (spec P0-8).
          failed=$(jq -r '[
              (if (.pass_age_s | type) != "number" or .pass_age_s >= 900 then "pass_age_s \(.pass_age_s) is not under 900" else empty end),
              (if (.dump_age_s | type) != "number" or .dump_age_s >= 25200 then "dump_age_s \(.dump_age_s) is not under 25200" else empty end),
              (if (.publish_lag_s | type) != "number" or .publish_lag_s >= 21600 then "publish_lag_s \(.publish_lag_s) is not under 21600" else empty end)
            ] | join("; ")' <<<"$status")
          if [ -n "$failed" ]; then
            echo "::error::$failed"
            exit 1
          fi
      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: Production probe failing

  edge-key:
    name: probe-edge-key
    # Weekly, once Edge publishing is set up (docs/deploy.md, Microsoft Edge Add-ons).
    if: vars.EDGE_PRODUCT_ID != '' && github.event.schedule != '41 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: edge-add-ons
      deployment: false
    steps:
      - uses: actions/checkout@v7
      # An operation that does not exist: 404 with a working key, 401 or 403 with an expired one.
      - name: The Edge API key still works
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/operations/00000000-0000-0000-0000-000000000000")
          if [ "$status" = 401 ] || [ "$status" = 403 ]; then
            echo "::error::The Edge Add-ons API key was refused (HTTP $status). Make a new one in Partner Center and update EDGE_API_KEY (docs/deploy.md)."
            exit 1
          fi
          echo "The Edge Add-ons API key works (an unknown operation answered HTTP $status)."
      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: Edge Add-ons API key refused
