# Releases. release-please keeps one release PR open per component (release-please-config.json);
# merging it is the human approval. Its draft releases are then:
#   platform  (vX.Y.Z)            deployed to production once staging has passed the same commit,
#                                 smoke-tested, rolled back automatically on failure, published
#   extension (extension-vX.Y.Z)  built for each store with provenance, attached and published, then
#                                 submitted to the Chrome Web Store as a staged publish, and to Edge
#                                 Add-ons and addons.mozilla.org once their variables are set
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    # Skips, and with it every release job, until the release App is set up (docs/deploy.md).
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # release-please works through the GitHub App token, so the workflow token needs nothing.
    permissions: {}
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      platform: ${{ steps.release.outputs.release_created }}
      platform_tag: ${{ steps.release.outputs.tag_name }}
      platform_sha: ${{ steps.release.outputs.sha }}
      extension: ${{ steps.release.outputs['extension--release_created'] }}
      extension_tag: ${{ steps.release.outputs['extension--tag_name'] }}
      extension_sha: ${{ steps.release.outputs['extension--sha'] }}
    steps:
      # The App token, unlike the workflow token, lets CI run on the release PRs it opens.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-production:
    name: deploy-production
    needs: release-please
    if: needs.release-please.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: production
      url: https://getcolander.com
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: write # publishes the draft release
      deployments: read
      actions: read
    env:
      TAG: ${{ needs.release-please.outputs.platform_tag }}
      SHA: ${{ needs.release-please.outputs.platform_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.platform_sha }}
      - name: Wait until staging has passed this commit
        timeout-minutes: 120
        run: |
          while :; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=staging&per_page=1" --jq '.[0].id // empty')
            state=""
            if [ -n "$id" ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
            fi
            case "$state" in
            success)
              echo "Staging deployment $id of $SHA succeeded."
              break
              ;;
            failure | error)
              echo "::error::Staging deployment $id of $SHA failed. Fix staging, re-run deploy-staging for this commit, then re-run this job."
              exit 1
              ;;
            esac
            ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --json status,conclusion \
              --jq 'if length > 0 and all(.status == "completed") and (map(.conclusion) | index("success") | not) then "failed" else "" end')
            if [ "$ci" = failed ]; then
              echo "::error::CI failed for $SHA, so staging will never deploy it."
              exit 1
            fi
            echo "Waiting for staging to deploy $SHA (deployment status: ${state:-none yet})"
            sleep 30
          done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build the website
        run: pnpm -C web build
        env:
          # A store whose listing is not live yet stays empty, and the site does not offer it.
          PUBLIC_STORE_CHROME: ${{ vars.CWS_ITEM_ID && format('https://chromewebstore.google.com/detail/{0}', vars.CWS_ITEM_ID) || '' }}
          PUBLIC_STORE_EDGE: ${{ vars.EDGE_ITEM_ID && format('https://microsoftedge.microsoft.com/addons/detail/{0}', vars.EDGE_ITEM_ID) || '' }}
          PUBLIC_STORE_FIREFOX: ${{ vars.AMO_SLUG && format('https://addons.mozilla.org/firefox/addon/{0}/', vars.AMO_SLUG) || '' }}
          # Pages prerender with the live numbers and latest decisions, read from the production Worker
          # that is still serving. A failed read falls back to empty pages with a build warning.
          COLANDER_BUILD_API: https://getcolander.com
      - name: Record the live version and list head
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version=$(pnpm --silent -C api exec wrangler deployments status --json | jq -r '.versions | max_by(.percentage) | .version_id // empty')
          if [ -z "$version" ]; then
            echo "::error::Could not read the live Worker version, so there would be no rollback target."
            exit 1
          fi
          seq=$(curl -sS --fail -o /dev/null -D - https://getcolander.com/v1/list/snapshot \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "x-colander-sequence" { print $2 }')
          echo "Live version $version, list head ${seq:-unknown}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "seq=$seq" >>"$GITHUB_OUTPUT"
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          packageManager: pnpm
          command: deploy --tag ${{ needs.release-please.outputs.platform_tag }} --message "Release ${{ needs.release-please.outputs.platform_tag }} (${{ needs.release-please.outputs.platform_sha }})"
      - name: Smoke test production (read-only)
        run: node scripts/smoke.ts --expect-cache ${SINCE:+--since "$SINCE"}
        env:
          COLANDER_BASE_URL: https://getcolander.com
          COLANDER_PUBLIC_KEYS: ${{ vars.COLANDER_PUBLIC_KEYS }}
          SINCE: ${{ steps.before.outputs.seq }}
      - name: Roll back to the version that was live before
        if: failure() && steps.before.outputs.version != ''
        env:
          PREVIOUS: ${{ steps.before.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          live=$(pnpm --silent -C api exec wrangler deployments status --json | jq -r '.versions | max_by(.percentage) | .version_id // empty')
          if [ "$live" = "$PREVIOUS" ]; then
            echo "Version $PREVIOUS is still live; nothing to roll back."
            exit 0
          fi
          pnpm -C api exec wrangler rollback "$PREVIOUS" --message "Auto-rollback: $TAG failed its production checks" --yes
          echo "::error::$TAG failed its production checks and was rolled back to version $PREVIOUS."
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  release-extension:
    name: release-extension
    needs: release-please
    if: needs.release-please.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # uploads to and publishes the draft release
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.release-please.outputs.extension_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build the store packages from release.env
        env:
          KEYS: ${{ vars.COLANDER_PUBLIC_KEYS }}
        run: |
          # release.env is what AMO's reviewers build with, so it must trust exactly the release keys.
          committed=$(sed -n 's/^WXT_COLANDER_PUBLIC_KEYS=//p' extension/release.env)
          if [ -z "$KEYS" ] || [ "$committed" != "$KEYS" ]; then
            echo "::error::extension/release.env must set WXT_COLANDER_PUBLIC_KEYS to the repository variable COLANDER_PUBLIC_KEYS (docs/deploy.md step 7)."
            exit 1
          fi
          rm -rf extension/dist
          for browser in chrome edge firefox; do bash extension/scripts/build-store.sh "$browser"; done
          bash extension/scripts/check-packages.sh
          pnpm -C extension exec web-ext lint --source-dir dist/firefox-mv3
          for zip in extension/dist/*-chrome.zip extension/dist/*-edge.zip extension/dist/*-firefox.zip; do
            version=$(unzip -p "$zip" manifest.json | jq -r .version)
            if [ "extension-v$version" != "$TAG" ]; then
              echo "::error::The manifest version $version in $zip does not match $TAG."
              exit 1
            fi
            # Never ship a build that trusts the published development key or talks to localhost.
            if unzip -p "$zip" | grep -a -q -e "$(cat testdata/dev-signing.pub)" -e 'localhost:8787'; then
              echo "::error::$zip contains the development signing key or a localhost origin."
              exit 1
            fi
          done
      - name: Rebuild the Firefox package from its sources zip, as AMO's reviewers do
        run: |
          rebuild="$RUNNER_TEMP/amo-rebuild"
          mkdir -p "$rebuild"
          unzip -q extension/dist/*-sources.zip -d "$rebuild"
          (cd "$rebuild" && pnpm install --frozen-lockfile && bash extension/scripts/build-store.sh firefox)
          if ! cmp "$rebuild"/extension/dist/*-firefox.zip extension/dist/*-firefox.zip; then
            echo "::error::The Firefox package does not rebuild byte for byte from its sources zip, which AMO's review requires."
            exit 1
          fi
      - uses: actions/attest@v4
        with:
          subject-path: |
            extension/dist/*-chrome.zip
            extension/dist/*-edge.zip
            extension/dist/*-firefox.zip
            extension/dist/*-sources.zip
      - name: Attach the packages and publish the release
        run: |
          gh release upload "$TAG" extension/dist/*-chrome.zip extension/dist/*-edge.zip extension/dist/*-firefox.zip extension/dist/*-sources.zip --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  submit-chrome-web-store:
    name: submit-chrome-web-store
    needs: [release-please, release-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ vars.CWS_ITEM_ID }}
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      TAG: ${{ needs.release-please.outputs.extension_tag }}
      GH_TOKEN: ${{ github.token }}
      ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_ITEM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_sha }}
      - name: Download the released package and verify its provenance
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-chrome.zip' --dir "$RUNNER_TEMP/package"
          zip=$(ls "$RUNNER_TEMP"/package/*-chrome.zip)
          gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY"
          echo "ZIP=$zip" >>"$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        id: google
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload, submit as a staged publish, and confirm the submission
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          api=https://chromewebstore.googleapis.com
          version=${TAG#extension-v}
          cws() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$@"; }

          upload=$(cws -X POST -T "$ZIP" "$api/upload/v2/$ITEM:upload")
          echo "upload: $upload"
          state=$(jq -r '.uploadState // empty' <<<"$upload")
          for _ in $(seq 60); do
            case "$state" in
            SUCCEEDED) break ;;
            IN_PROGRESS | UPLOAD_IN_PROGRESS)
              sleep 10
              state=$(cws "$api/v2/$ITEM:fetchStatus" | jq -r '.lastAsyncUploadState // empty')
              ;;
            *)
              echo "::error::The upload ended in state ${state:-unknown}."
              exit 1
              ;;
            esac
          done
          if [ "$state" != SUCCEEDED ]; then
            echo "::error::The upload was still processing after 10 minutes."
            exit 1
          fi

          # STAGED_PUBLISH: after review the item waits in the dashboard until you publish it,
          # once the production backend it needs is live.
          publish=$(jq -n '{publishType: "STAGED_PUBLISH"}' | cws -X POST -H 'Content-Type: application/json' -d @- "$api/v2/$ITEM:publish")
          echo "publish: $publish"

          for _ in $(seq 30); do
            status=$(cws "$api/v2/$ITEM:fetchStatus")
            submitted=$(jq -r '.submittedItemRevisionStatus.state // empty' <<<"$status")
            submitted_version=$(jq -r '.submittedItemRevisionStatus.distributionChannels[0].crxVersion // empty' <<<"$status")
            published_version=$(jq -r '.publishedItemRevisionStatus.distributionChannels[0].crxVersion // empty' <<<"$status")
            if [ "$(jq -r '.takenDown // false' <<<"$status")" = true ]; then
              echo "::error::The item is taken down for a policy violation; see the developer dashboard."
              exit 1
            fi
            case "$submitted" in
            REJECTED | CANCELLED)
              echo "::error::The submission is $submitted: $status"
              exit 1
              ;;
            esac
            if [ "$submitted_version" = "$version" ] || [ "$published_version" = "$version" ]; then
              echo "### Chrome Web Store: $version is ${submitted:-published}" >>"$GITHUB_STEP_SUMMARY"
              echo "Review takes days. Publish the staged item in the developer dashboard once its backend is live." >>"$GITHUB_STEP_SUMMARY"
              echo "Submitted $version: ${submitted:-published}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::fetchStatus never showed version $version as submitted: $status"
          exit 1

  # Edge Add-ons: the same code as the Chrome package, never a key. The first version is uploaded
  # by hand in Partner Center; this job skips until EDGE_PRODUCT_ID is set (docs/deploy.md).
  submit-edge-add-ons:
    name: submit-edge-add-ons
    needs: [release-please, release-extension]
    if: vars.EDGE_PRODUCT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: edge-add-ons
      url: https://microsoftedge.microsoft.com/addons/detail/${{ vars.EDGE_ITEM_ID }}
    concurrency:
      group: edge-add-ons
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.release-please.outputs.extension_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the released package and verify its provenance
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-edge.zip' --dir "$RUNNER_TEMP/package"
          zip=$(ls "$RUNNER_TEMP"/package/*-edge.zip)
          gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY"
          echo "ZIP=$zip" >>"$GITHUB_ENV"
      - name: Upload, submit for certification, and confirm the submission
        env:
          API: https://api.addons.microsoftedge.microsoft.com/v1/products/${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          edge() { curl -sS -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID" "$@"; }
          # Each POST answers 202 with its operation ID at the end of the Location header; the
          # operation is then polled until it succeeds or fails.
          post() {
            local status headers
            headers=$(mktemp)
            status=$(edge -o /dev/null -D "$headers" -w '%{http_code}' -X POST "$@")
            if [ "$status" = 401 ] || [ "$status" = 403 ]; then
              echo "::error::Edge refused the API key (HTTP $status). Keys expire 72 days after they are made: make a new one in Partner Center and update EDGE_API_KEY."
              exit 1
            fi
            if [ "$status" != 202 ]; then
              echo "::error::Edge answered HTTP $status to a POST to ${*: -1}."
              exit 1
            fi
            OPERATION=$(tr -d '\r' <"$headers" | awk -F': ' 'tolower($1) == "location" { print $2 }' | sed 's#.*/##')
          }
          wait_for() {
            local result="" status
            for _ in $(seq 60); do
              result=$(edge "$1")
              status=$(jq -r '.status // empty' <<<"$result")
              case "$status" in
              Succeeded) return 0 ;;
              InProgress) sleep 10 ;;
              *)
                echo "::error::Edge reports ${status:-no status}: $result"
                exit 1
                ;;
              esac
            done
            echo "::error::Edge was still working after 10 minutes: $result"
            exit 1
          }

          post -H 'Content-Type: application/zip' -T "$ZIP" "$API/submissions/draft/package"
          wait_for "$API/submissions/draft/package/operations/$OPERATION"
          notes=$(jq -n --arg notes "Colander $TAG, built with provenance: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" '{notes: $notes}')
          post -H 'Content-Type: application/json' -d "$notes" "$API/submissions"
          wait_for "$API/submissions/operations/$OPERATION"
          echo "### Edge Add-ons: ${TAG#extension-v} is submitted for certification" >>"$GITHUB_STEP_SUMMARY"
          echo "Certification takes up to 7 business days, and Edge publishes it when it passes." >>"$GITHUB_STEP_SUMMARY"

  # addons.mozilla.org, listed: the Firefox package with its sources zip, which AMO's reviewers
  # rebuild. The first version is uploaded by hand; this job skips until AMO_SLUG is set (docs/deploy.md).
  submit-amo:
    name: submit-amo
    needs: [release-please, release-extension]
    if: vars.AMO_SLUG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: amo
      url: https://addons.mozilla.org/firefox/addon/${{ vars.AMO_SLUG }}/
    concurrency:
      group: amo
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.release-please.outputs.extension_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.extension_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Download the released packages and verify their provenance
        run: |
          dir="$RUNNER_TEMP/package"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-firefox.zip' --pattern '*-sources.zip' --dir "$dir"
          for zip in "$dir"/*.zip; do gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY"; done
          mkdir "$dir/firefox"
          unzip -q "$dir"/*-firefox.zip -d "$dir/firefox"
          echo "ADDON_DIR=$dir/firefox" >>"$GITHUB_ENV"
          echo "SOURCES=$(ls "$dir"/*-sources.zip)" >>"$GITHUB_ENV"
      - name: Submit the listed version with its sources
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_REVIEWER_NOTES: ${{ secrets.AMO_REVIEWER_NOTES }}
        run: |
          # The listing metadata is committed; the reviewer notes carry the test account, so they come from a secret.
          meta="$RUNNER_TEMP/amo-metadata.json"
          jq --arg notes "$AMO_REVIEWER_NOTES" '.version.approval_notes = $notes' extension/amo/metadata.json >"$meta"
          pnpm -C extension exec web-ext sign --channel listed --source-dir "$ADDON_DIR" --upload-source-code "$SOURCES" \
            --amo-metadata "$meta" --approval-timeout 0 --artifacts-dir "$RUNNER_TEMP/signed" \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          echo "### addons.mozilla.org: ${TAG#extension-v} is submitted for review" >>"$GITHUB_STEP_SUMMARY"
          echo "Signing usually takes under a day; a manual review can take longer, and AMO publishes it when it passes." >>"$GITHUB_STEP_SUMMARY"
