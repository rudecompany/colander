# Every check that gates a merge to main. Branch protection requires each job below by its name,
# so keep the names stable (docs/deploy.md, "GitHub repository settings").
# A successful run on main starts deploy-staging.yml. No Cloudflare secrets are used here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflows (actionlint with shellcheck)
        run: |
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color
      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh

  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No migration may delete, rename or transfer the Store class
        run: node scripts/wrangler-guard.ts api/wrangler.jsonc
      - run: pnpm -C api check
      # Includes the dump-compat check: a seeded Store's dump loads into stock SQLite with the
      # schema of the migration files and passes integrity_check (api/test/harness/dev.test.ts).
      - run: pnpm -C api test
      # The Worker serves web/build as its static assets, so the dry run needs a built site.
      - run: pnpm -C web build
      - run: pnpm -C api deploy:dry

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fixtures match their generator
        run: node testdata/contract/generate.mjs && git diff --exit-code testdata/contract

  web-and-extension:
    name: web-and-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm -r check
      # The in-page builders, formats and generated tokens in Node; the list and ID tests also run in the api job.
      - run: pnpm -C packages/shared test
      - run: pnpm -C web test
      - run: pnpm -C extension build
      - run: pnpm -C extension test
      - run: xvfb-run -a pnpm -C extension test:e2e

  # The Worker under wrangler dev, the website and the extension together in Chromium (e2e/).
  full-stack:
    name: full-stack
    runs-on: ubuntu-latest
    needs: [api, web-and-extension]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: xvfb-run -a make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-results
          path: |
            e2e/.run/server.log
            e2e/test-results
            e2e/screenshots
