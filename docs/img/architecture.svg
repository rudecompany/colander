<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" width="760" height="584" role="img" aria-label="Matching stays on the device, and only tags and reports go to the server" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<title>Matching stays on the device, and only tags and reports go to the server</title>
<rect width="760" height="584" fill="#FFFFFF"/>
<defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E8A80"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1A1C1F">Matching stays on the device, and only tags and reports go to the server</text>
<rect x="24" y="56" width="712" height="200" rx="10" fill="#F3F0E9" stroke="#BDB8AD" stroke-width="1"/>
<text x="40" y="77" font-size="13" font-weight="600" fill="#1A1C1F">On the device: the extension</text>
<rect x="24" y="344" width="712" height="216" rx="10" fill="#F3F0E9" stroke="#BDB8AD" stroke-width="1"/>
<text x="40" y="365" font-size="13" font-weight="600" fill="#1A1C1F">Our services</text>
<rect x="40" y="88" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="52" y="112" font-size="13" font-weight="600" fill="#1A1C1F">Platform adapters</text><text x="52" y="128" font-size="11.5" fill="#5A5F66">Read each card and its IDs.</text><text x="52" y="144" font-size="11.5" fill="#5A5F66">Label, collapse or hide it.</text>
<rect x="272" y="88" width="216" height="72" rx="8" fill="#E4EAF1" stroke="#1F4E8C" stroke-width="2"/>
<text x="284" y="112" font-size="13" font-weight="600" fill="#1A1C1F">Lists and settings</text><text x="284" y="128" font-size="11.5" fill="#5A5F66">Kept on the device.</text><text x="284" y="144" font-size="11.5" fill="#5A5F66">Matching happens here.</text>
<rect x="504" y="88" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="516" y="112" font-size="13" font-weight="600" fill="#1A1C1F">Popup, panel, options</text><text x="516" y="128" font-size="11.5" fill="#5A5F66">Counts, recent actions,</text><text x="516" y="144" font-size="11.5" fill="#5A5F66">strictness and plan.</text>
<rect x="40" y="184" width="680" height="56" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="52" y="208" font-size="13" font-weight="600" fill="#1A1C1F">Service worker</text>
<text x="52" y="224" font-size="11.5" fill="#5A5F66">Syncs and verifies signed lists on a timer, and queues tags and reports for sending.</text>
<rect x="40" y="376" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="52" y="400" font-size="13" font-weight="600" fill="#1A1C1F">List service</text><text x="52" y="416" font-size="11.5" fill="#5A5F66">Signed snapshots and</text><text x="52" y="432" font-size="11.5" fill="#5A5F66">deltas through a CDN.</text>
<rect x="272" y="376" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="284" y="400" font-size="13" font-weight="600" fill="#1A1C1F">Scoring service</text><text x="284" y="416" font-size="11.5" fill="#5A5F66">Reputation, consensus and</text><text x="284" y="432" font-size="11.5" fill="#5A5F66">source signals set verdicts.</text>
<rect x="504" y="376" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="516" y="400" font-size="13" font-weight="600" fill="#1A1C1F">Tag service</text><text x="516" y="416" font-size="11.5" fill="#5A5F66">Takes tags and reports.</text><text x="516" y="432" font-size="11.5" fill="#5A5F66">Rate limits, abuse checks.</text>
<rect x="40" y="472" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="52" y="496" font-size="13" font-weight="600" fill="#1A1C1F">Billing</text><text x="52" y="512" font-size="11.5" fill="#5A5F66">Hosted checkout. Sends</text><text x="52" y="528" font-size="11.5" fill="#5A5F66">a signed plan token.</text>
<rect x="272" y="472" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="284" y="496" font-size="13" font-weight="600" fill="#1A1C1F">Review console</text><text x="284" y="512" font-size="11.5" fill="#5A5F66">Staff queue for reports</text><text x="284" y="528" font-size="11.5" fill="#5A5F66">and appeals.</text>
<rect x="504" y="472" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="516" y="496" font-size="13" font-weight="600" fill="#1A1C1F">Public site</text><text x="516" y="512" font-size="11.5" fill="#5A5F66">Source pages, appeals,</text><text x="516" y="528" font-size="11.5" fill="#5A5F66">decision log.</text>
<path d="M256 124H272" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"/>
<path d="M380 184V160" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-end="url(#arch-arrow)"/>
<path d="M148 160V184" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-end="url(#arch-arrow)"/>
<path d="M148 376V240" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-end="url(#arch-arrow)"/>
<path d="M612 240V376" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-end="url(#arch-arrow)"/>
<path d="M504 412H488" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-end="url(#arch-arrow)"/>
<path d="M272 412H256" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-end="url(#arch-arrow)"/>
<path d="M380 448V472" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"/>
<path d="M504 508H488" fill="none" stroke="#8E8A80" stroke-width="1.25" marker-end="url(#arch-arrow)"/>
<text x="158" y="304" font-size="11.5" fill="#5A5F66">signed lists</text>
<text x="622" y="304" font-size="11.5" fill="#5A5F66">tags and reports</text>
<text x="380" y="304" text-anchor="middle" font-size="11.5" fill="#5A5F66">No page addresses or history cross here</text>
</svg>
