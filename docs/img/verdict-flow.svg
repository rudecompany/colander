<rect x="452" y="252" width="284" height="56" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/>
<text x="468" y="276" font-size="13" font-weight="600" fill="#1A1C1F">Likely slop: collapse</text><text x="468" y="292" font-size="11.5" fill="#5A5F66">Evidence is in, consensus still forming</text>
<text x="204" y="140" font-size="11.5" fill="#5A5F66">yes</text>
