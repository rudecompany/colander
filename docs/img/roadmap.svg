<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" role="img" aria-label="Each phase opens only when the gate before it passes" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
<title>Each phase opens only when the gate before it passes</title>
<rect width="760" height="232" fill="#FFFFFF"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1A1C1F">Each phase opens only when the gate before it passes</text>
<rect x="24" y="60" width="128" height="96" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/><text x="34" y="84" font-size="13" font-weight="600" fill="#1A1C1F">0 Foundations</text><text x="34" y="100" font-size="11.5" fill="#5A5F66">Oct–Nov 2026</text><text x="34" y="122" font-size="11.5" fill="#1A1C1F">Legal review,</text><text x="34" y="138" font-size="11.5" fill="#1A1C1F">calibration set</text>
<rect x="170" y="60" width="128" height="96" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/><text x="180" y="84" font-size="13" font-weight="600" fill="#1A1C1F">1 Private beta</text><text x="180" y="100" textLength="104" lengthAdjust="spacingAndGlyphs" font-size="11.5" fill="#5A5F66">Dec 2026–Jan 2027</text><text x="180" y="122" font-size="11.5" fill="#1A1C1F">YouTube, for</text><text x="180" y="138" font-size="11.5" fill="#1A1C1F">500 testers</text>
<rect x="316" y="60" width="128" height="96" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/><text x="326" y="84" font-size="13" font-weight="600" fill="#1A1C1F">2 Public beta</text><text x="326" y="100" font-size="11.5" fill="#5A5F66">Feb–Mar 2027</text><text x="326" y="122" font-size="11.5" fill="#1A1C1F">Adds TikTok and</text><text x="326" y="138" font-size="11.5" fill="#1A1C1F">Instagram</text>
<rect x="462" y="60" width="128" height="96" rx="8" fill="#E4EAF1" stroke="#1F4E8C" stroke-width="2"/><text x="472" y="84" font-size="13" font-weight="600" fill="#1A1C1F">3 Version 1.0</text><text x="472" y="100" font-size="11.5" fill="#5A5F66">Apr–May 2027</text><text x="472" y="122" font-size="11.5" fill="#1A1C1F">Adds Facebook</text><text x="472" y="138" font-size="11.5" fill="#1A1C1F">and the Plus plan</text>
<rect x="608" y="60" width="128" height="96" rx="8" fill="#FFFFFF" stroke="#BDB8AD" stroke-width="1.25"/><text x="618" y="84" font-size="13" font-weight="600" fill="#1A1C1F">4 Version 1.1</text><text x="618" y="100" font-size="11.5" fill="#5A5F66">Jul–Sep 2027</text><text x="618" y="122" font-size="11.5" fill="#1A1C1F">Articles, search,</text><text x="618" y="138" font-size="11.5" fill="#1A1C1F">Family, Firefox</text>
<line x1="161" y1="116" x2="161" y2="170" stroke="#8E8A80" stroke-width="1"/><path d="M161 100l8 8l-8 8l-8 -8z" fill="#8E8A80"/><text x="161" y="186" text-anchor="middle" font-size="11.5" fill="#5A5F66">Counsel sign-off,</text><text x="161" y="202" text-anchor="middle" font-size="11.5" fill="#5A5F66">thresholds set</text>
<line x1="307" y1="116" x2="307" y2="170" stroke="#8E8A80" stroke-width="1"/><path d="M307 100l8 8l-8 8l-8 -8z" fill="#8E8A80"/><text x="307" y="186" text-anchor="middle" font-size="11.5" fill="#5A5F66">Wrong calls at or</text><text x="307" y="202" text-anchor="middle" font-size="11.5" fill="#5A5F66">under 1 in 100</text>
<line x1="453" y1="116" x2="453" y2="170" stroke="#8E8A80" stroke-width="1"/><path d="M453 100l8 8l-8 8l-8 -8z" fill="#8E8A80"/><text x="453" y="186" text-anchor="middle" font-size="11.5" fill="#5A5F66">Appeals in 7 days,</text><text x="453" y="202" text-anchor="middle" font-size="11.5" fill="#5A5F66">brigading drill</text>
<line x1="599" y1="116" x2="599" y2="170" stroke="#8E8A80" stroke-width="1"/><path d="M599 100l8 8l-8 8l-8 -8z" fill="#8E8A80"/><text x="599" y="186" text-anchor="middle" font-size="11.5" fill="#5A5F66">1.0 goals met</text><text x="599" y="202" text-anchor="middle" font-size="11.5" fill="#5A5F66">on the audit</text>
</svg>
